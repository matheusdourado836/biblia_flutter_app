# Configuração do analisador estático.
# Referência: https://dart.dev/tools/analysis
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Uso de BuildContext depois de um await sem checar mounted é a causa mais
    # comum de crash "widget desmontado" em produção: falha o build, não passa.
    use_build_context_synchronously: error
    # print() em produção vaza dados no logcat e não chega ao Sentry.
    # Use logError/logInfo (lib/helpers/app_logger.dart).
    avoid_print: error
    unused_import: error
    unused_local_variable: error
    unused_field: error
    dead_code: error
  exclude:
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - android/**
    - ios/**

linter:
  rules:
    # Higiene de recursos e assincronismo
    - cancel_subscriptions
    - close_sinks
    - avoid_slow_async_io
    - avoid_empty_else
    - empty_statements
    - no_adjacent_strings_in_list

    # Correção
    - avoid_returning_null_for_void
    - avoid_type_to_string
    - collection_methods_unrelated_type
    - literal_only_boolean_expressions
    - prefer_void_to_null
    - throw_in_finally
    - unnecessary_statements
    - use_rethrow_when_possible
